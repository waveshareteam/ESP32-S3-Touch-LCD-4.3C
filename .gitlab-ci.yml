stages:
  - test
  - prepare
  - build

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  GIT_DEPTH: "20"
  ARDUINO_CLI_VERSION: "1.5.1"
  ARDUINO_CORE_VERSION: "3.3.11"
  ARDUINO_DIRECTORIES_DATA: "$CI_PROJECT_DIR/.arduino-data"
  ARDUINO_DIRECTORIES_DOWNLOADS: "$CI_PROJECT_DIR/.arduino-downloads"
  ARDUINO_DIRECTORIES_USER: "$CI_PROJECT_DIR/.arduino-user"
  ARDUINO_CLI: "$CI_PROJECT_DIR/.ci-tools/arduino-cli"

validate-tooling:
  stage: test
  image: python:3.12-slim
  timeout: 10m
  script:
    - python3 -m unittest discover -s scripts/tests -p "test_*.py"
    - python3 -m unittest discover -s releases/tests -p "test_*.py"
    - python3 -m py_compile scripts/discover_examples.py releases/*.py
    - python3 -m json.tool config/ci.json >/dev/null
    - python3 -m json.tool config/factory-firmware.json >/dev/null
    - python3 scripts/discover_examples.py --surface esp-idf --expect-examples 14 >/dev/null
    - python3 scripts/discover_examples.py --surface arduino --expect-examples 15 >/dev/null
    - python3 releases/validate_factory_firmware.py

prepare-arduino:
  stage: prepare
  image: python:3.12-bookworm
  timeout: 30m
  needs:
    - validate-tooling
  cache:
    key: "arduino-cli-${ARDUINO_CLI_VERSION}-esp32-${ARDUINO_CORE_VERSION}"
    paths:
      - .ci-tools/
      - .arduino-data/
      - .arduino-downloads/
      - .arduino-user/
    policy: pull-push
  script:
    - mkdir -p .ci-tools "$ARDUINO_DIRECTORIES_DATA" "$ARDUINO_DIRECTORIES_DOWNLOADS" "$ARDUINO_DIRECTORIES_USER"
    - |
      if [ ! -x "$ARDUINO_CLI" ]; then
        curl --fail --location --retry 3 \
          "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz" \
          --output /tmp/arduino-cli.tar.gz
        tar -xzf /tmp/arduino-cli.tar.gz -C .ci-tools arduino-cli
        chmod +x "$ARDUINO_CLI"
      fi
    - $ARDUINO_CLI version
    - >-
      $ARDUINO_CLI core update-index
      --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
    - >-
      $ARDUINO_CLI core install "esp32:esp32@$ARDUINO_CORE_VERSION"
      --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

build-esp-idf:
  stage: build
  image:
    name: "espressif/idf:${IDF_VERSION}"
    entrypoint: [""]
  timeout: 45m
  needs:
    - validate-tooling
  parallel:
    matrix:
      - IDF_VERSION:
          - "v5.5.5"
          - "v6.0.2"
        EXAMPLE_NAME:
          - "01_i2c"
          - "02_rtc"
          - "03_lcd"
          - "04_isolation_io"
          - "05_sd"
          - "06_touch"
          - "07_display_bmp"
          - "08_wifi_scan"
          - "09_wifi_sta"
          - "10_wifi_ap"
          - "11_speaker_microphone"
          - "12_lvgl_transplant"
          - "13_lvgl_codec"
          - "14_udp_tcp_ntp"
  before_script:
    - . "$IDF_PATH/export.sh"
  script:
    - export EXAMPLE_PATH="examples/esp-idf/$EXAMPLE_NAME"
    - export BUILD_DIR="$CI_PROJECT_DIR/.ci-build/esp-idf/$EXAMPLE_NAME-$IDF_VERSION"
    - idf.py --version
    - idf.py -C "$EXAMPLE_PATH" -B "$BUILD_DIR" set-target esp32s3 build
    - export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$CI_COMMIT_SHA")"
    - >-
      python3 releases/package_firmware.py
      --framework esp-idf
      --project "$EXAMPLE_PATH"
      --build-dir "$BUILD_DIR"
      --name "ESP32-S3-Touch-LCD-4.3C-$EXAMPLE_NAME-esp-idf-$IDF_VERSION-esp32s3"
      --framework-version "$IDF_VERSION"
      --target esp32s3
      --git-sha "$CI_COMMIT_SHA"
      --output-dir release-artifacts
    - python3 releases/validate_firmware.py release-artifacts/*.zip
  artifacts:
    name: "firmware-esp-idf-$EXAMPLE_NAME-$IDF_VERSION-$CI_COMMIT_SHORT_SHA"
    paths:
      - release-artifacts/*.zip
    expire_in: 30 days

build-arduino:
  stage: build
  image: python:3.12-bookworm
  timeout: 30m
  needs:
    - prepare-arduino
  parallel:
    matrix:
      - EXAMPLE_NAME:
          - "01_i2c"
          - "02_rtc"
          - "03_lcd"
          - "04_isolation_io"
          - "05_sd"
          - "06_touch"
          - "07_display_bmp"
          - "08_wifi_scan"
          - "09_wifi_sta"
          - "10_wifi_ap"
          - "11_speaker_microphone"
          - "12_lvgl_transplant"
          - "13_lvgl_btn"
          - "14_lvgl_slider"
          - "15_udp_tcp_ntp"
  cache:
    key: "arduino-cli-${ARDUINO_CLI_VERSION}-esp32-${ARDUINO_CORE_VERSION}"
    paths:
      - .ci-tools/
      - .arduino-data/
      - .arduino-downloads/
      - .arduino-user/
    policy: pull
  before_script:
    - mkdir -p .ci-tools "$ARDUINO_DIRECTORIES_DATA" "$ARDUINO_DIRECTORIES_DOWNLOADS" "$ARDUINO_DIRECTORIES_USER"
    - |
      if [ ! -x "$ARDUINO_CLI" ]; then
        curl --fail --location --retry 3 \
          "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz" \
          --output /tmp/arduino-cli.tar.gz
        tar -xzf /tmp/arduino-cli.tar.gz -C .ci-tools arduino-cli
        chmod +x "$ARDUINO_CLI"
      fi
    - >-
      $ARDUINO_CLI core update-index
      --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
    - >-
      $ARDUINO_CLI core install "esp32:esp32@$ARDUINO_CORE_VERSION"
      --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
  script:
    - export EXAMPLE_PATH="examples/arduino/$EXAMPLE_NAME"
    - export BUILD_DIR="$CI_PROJECT_DIR/.ci-build/arduino/$EXAMPLE_NAME-$ARDUINO_CORE_VERSION"
    - $ARDUINO_CLI version
    - >-
      $ARDUINO_CLI compile
      --fqbn "esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,UploadMode=default,UploadSpeed=921600,LoopCore=1,EventsCore=1"
      --libraries examples/arduino/libraries
      --export-binaries
      --output-dir "$BUILD_DIR"
      "$EXAMPLE_PATH"
    - export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$CI_COMMIT_SHA")"
    - >-
      python3 releases/package_firmware.py
      --framework arduino
      --project "$EXAMPLE_PATH"
      --build-dir "$BUILD_DIR"
      --name "ESP32-S3-Touch-LCD-4.3C-$EXAMPLE_NAME-arduino-$ARDUINO_CORE_VERSION-esp32s3"
      --framework-version "$ARDUINO_CORE_VERSION"
      --target esp32s3
      --git-sha "$CI_COMMIT_SHA"
      --output-dir release-artifacts
    - python3 releases/validate_firmware.py release-artifacts/*.zip
  artifacts:
    name: "firmware-arduino-$EXAMPLE_NAME-$ARDUINO_CORE_VERSION-$CI_COMMIT_SHORT_SHA"
    paths:
      - release-artifacts/*.zip
    expire_in: 30 days
